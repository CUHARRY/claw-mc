<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcade Mystery Claw Dare Machine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --cabinet-main: #ff2a6d;
      --cabinet-dark: #a00b3e;
      --cabinet-border: #680424;
      --neon-cyan: #05d9e8;
      --neon-gold: #ffbe0b;
      --neon-purple: #7928ca;
      --deck-bg: #1a152e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #2a1f4d 0%, #0d091a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 8px 12px 24px;
    }

    /* Cabinet Framing */
    .arcade-machine {
      width: 100%;
      max-width: 410px;
      background: linear-gradient(180deg, var(--cabinet-main) 0%, var(--cabinet-dark) 100%);
      border: 5px solid var(--cabinet-border);
      border-radius: 28px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.75), inset 0 3px 6px rgba(255, 255, 255, 0.4);
      position: relative;
      overflow: hidden;
    }

    /* Marquee Neon Header */
    .marquee {
      background: #110c22;
      border-bottom: 4px solid var(--cabinet-border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .neon-text {
      color: var(--neon-cyan);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(5, 217, 232, 0.8), 0 0 16px rgba(5, 217, 232, 0.5);
      font-size: 1.15rem;
    }

    .light-bead {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neon-gold);
      box-shadow: 0 0 6px var(--neon-gold);
      animation: blink 1.2s infinite alternate;
    }
    .light-bead:nth-child(even) {
      animation-delay: 0.6s;
      background: var(--neon-cyan);
      box-shadow: 0 0 6px var(--neon-cyan);
    }

    @keyframes blink {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Glass Chamber */
    .glass-chamber {
      height: 310px;
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(160,230,255,0.06) 75%, rgba(90,170,255,0.12) 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 5px solid var(--cabinet-border);
      box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.15);
    }

    /* Claw Mechanism */
    .track-rail {
      position: absolute;
      top: 6px;
      left: 12px;
      right: 12px;
      height: 8px;
      background: #474b59;
      border-radius: 4px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
    }

    .claw-assembly {
      position: absolute;
      top: 6px;
      left: 60px;
      width: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
      transform: translateX(-50%) translate3d(0,0,0);
      -webkit-transform: translateX(-50%) translate3d(0,0,0);
      pointer-events: none;
    }

    .claw-carriage {
      width: 28px;
      height: 10px;
      background: #2b2d38;
      border-radius: 3px;
      border: 1px solid #71768a;
    }

    .claw-cable {
      width: 3px;
      height: 28px;
      background: linear-gradient(180deg, #aaa 0%, #666 100%);
      box-shadow: 0 0 3px rgba(0,0,0,0.5);
    }

    .claw-motor-head {
      width: 28px;
      height: 12px;
      background: #4a4e69;
      border-radius: 4px;
      border: 1px solid #8b92b0;
    }

    .claw-fingers {
      position: relative;
      width: 42px;
      height: 28px;
    }

    .claw-finger {
      position: absolute;
      width: 6px;
      height: 26px;
      background: linear-gradient(180deg, #e4e7eb 0%, #828a99 100%);
      border-radius: 3px;
      top: 0;
      -webkit-transition: -webkit-transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .finger-left {
      left: 7px;
      transform-origin: top center;
      -webkit-transform-origin: top center;
      transform: rotate(-32deg);
      -webkit-transform: rotate(-32deg);
    }
    .finger-right {
      right: 7px;
      transform-origin: top center;
      -webkit-transform-origin: top center;
      transform: rotate(32deg);
      -webkit-transform: rotate(32deg);
    }

    .claw-fingers.closed .finger-left {
      transform: rotate(14deg);
      -webkit-transform: rotate(14deg);
    }
    .claw-fingers.closed .finger-right {
      transform: rotate(-14deg);
      -webkit-transform: rotate(-14deg);
    }

    .claw-held-ball {
      position: absolute;
      top: 18px;
      display: none;
      z-index: 18;
      pointer-events: none;
    }

    /* Chute drop bin */
    .chute-target {
      position: absolute;
      bottom: 0;
      left: 8px;
      width: 68px;
      height: 48px;
      background: rgba(10, 8, 20, 0.7);
      border: 2px dashed var(--neon-gold);
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px rgba(255, 190, 11, 0.3);
    }

    .chute-target span {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--neon-gold);
      letter-spacing: 1px;
    }

    /* Ball pit */
    .ball-pit {
      position: absolute;
      bottom: 6px;
      left: 84px;
      right: 10px;
      height: 125px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-end;
      gap: 5px;
      padding-bottom: 2px;
    }

    .capsule-ball {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset -3px -4px 6px rgba(0,0,0,0.55), inset 3px 3px 6px rgba(255,255,255,0.7), 0 3px 6px rgba(0,0,0,0.4);
      font-size: 0.68rem;
      font-weight: 900;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 1px 2px rgba(0,0,0,0.85);
      transition: transform 0.2s ease;
    }

    /* Control Deck Area */
    .control-deck {
      background: var(--deck-bg);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dash-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d091c;
      border: 1px solid #362e55;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .control-actions {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 10px;
      align-items: center;
    }

    .directional-cluster {
      display: flex;
      gap: 8px;
    }

    .arcade-dir-btn {
      flex: 1;
      height: 56px;
      background: linear-gradient(180deg, #493d6e 0%, #292044 100%);
      border: 2px solid #6b5c9c;
      border-radius: 14px;
      color: #fff;
      font-size: 1.5rem;
      font-weight: 900;
      box-shadow: 0 5px 0 #140f24;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .arcade-dir-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #140f24;
      background: #292044;
    }

    .drop-btn {
      height: 56px;
      background: linear-gradient(180deg, #05d9e8 0%, #008899 100%);
      border: 2px solid #75f8ff;
      border-radius: 14px;
      color: #05262c;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 5px 0 #00545e, 0 0 14px rgba(5, 217, 232, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .drop-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #00545e;
    }

    .drop-btn:disabled, .arcade-dir-btn:disabled {
      background: #393649 !important;
      border-color: #55506b !important;
      color: #7d7796 !important;
      box-shadow: 0 4px 0 #1b1926 !important;
      cursor: not-allowed !important;
      opacity: 0.65;
    }

    /* Prize Slot at bottom */
    .dispenser-slot {
      height: 54px;
      background: #080611;
      border: 2px solid #2d264a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .dispensed-ball {
      padding: 7px 16px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 0.82rem;
      color: #120e24;
      cursor: pointer;
      animation: prizePop 0.8s infinite alternate;
      box-shadow: 0 0 15px rgba(255, 190, 11, 0.6);
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes prizePop {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.05); }
    }

    /* Modals & Dialogs */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 2, 10, 0.85);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: linear-gradient(180deg, #231b3b 0%, #130f24 100%);
      border: 2px solid var(--cabinet-main);
      box-shadow: 0 0 25px rgba(255, 42, 109, 0.35);
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      transform: scale(0.92);
      transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #ff2a6d;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Sound / Dares Studio Toggle -->
  <header class="w-full max-w-[410px] flex items-center justify-between py-2 px-1 text-xs">
    <button onclick="openDareStudio()" class="bg-purple-900/70 hover:bg-purple-800 text-purple-200 border border-purple-400/50 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5 shadow active:scale-95 transition">
      <span>✏️ Dare Studio</span>
      <span id="dareBadgeCount" class="bg-pink-600 text-white rounded-full px-1.5 text-[10px] font-black">1</span>
    </button>
    <div class="flex items-center gap-1.5">
      <button onclick="reseedPitBalls()" title="Reshuffle Chamber Balls" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-600 px-2 py-1.5 rounded-lg font-bold">
        🔄 Shuffle
      </button>
      <button onclick="toggleAudio()" id="soundToggleBtn" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-600 px-2.5 py-1.5 rounded-lg font-bold">
        🔊 Sound: ON
      </button>
    </div>
  </header>

  <!-- Arcade Machine Cabinet Container -->
  <main class="arcade-machine">
    
    <!-- Marquee Banner with Animated Bulbs -->
    <div class="marquee">
      <div class="flex items-center gap-1.5">
        <div class="light-bead"></div>
        <div class="light-bead"></div>
      </div>
      <div class="neon-text">★ DARE CLAW ★</div>
      <div class="flex items-center gap-1.5">
        <div class="light-bead"></div>
        <div class="light-bead"></div>
      </div>
    </div>

    <!-- Transparent Chamber with Mechanism -->
    <section class="glass-chamber" id="glassChamber">
      <!-- Top Track Rail -->
      <div class="track-rail"></div>

      <!-- Claw Assembly -->
      <div class="claw-assembly" id="clawAssembly">
        <div class="claw-carriage"></div>
        <div class="claw-cable" id="clawCable"></div>
        <div class="claw-motor-head"></div>
        <div class="claw-fingers" id="clawFingers">
          <div class="claw-finger finger-left"></div>
          <div class="claw-finger finger-right"></div>
        </div>
        <!-- In-flight Grabbed Ball -->
        <div class="capsule-ball claw-held-ball" id="heldBall">★</div>
      </div>

      <!-- Left Drop Chute Hole -->
      <div class="chute-target">
        <span>DROP</span>
        <span class="text-[9px]">⬇ HERE</span>
      </div>

      <!-- Pit of Colorful Balls -->
      <div class="ball-pit" id="pitContainer"></div>
    </section>

    <!-- Mobile Arcade Controls Deck -->
    <section class="control-deck">
      <!-- Status Dashboard -->
      <div class="dash-row">
        <div>
          <span class="text-pink-400 font-extrabold uppercase text-xs">Attempts:</span>
          <span id="turnsCounter" class="text-white text-sm font-black ml-1">10/10</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" id="statusDot"></span>
          <span id="statusText" class="text-emerald-400 text-xs font-bold uppercase tracking-wider">Ready to Aim</span>
        </div>
      </div>

      <!-- Steering & Trigger Controls -->
      <div class="control-actions">
        <!-- Directional Left / Right Steering Buttons (Hold or Tap) -->
        <div class="directional-cluster">
          <button class="arcade-dir-btn" id="btnLeft" title="Hold to Move Left">◀</button>
          <button class="arcade-dir-btn" id="btnRight" title="Hold to Move Right">▶</button>
        </div>
        <!-- Trigger Drop Button -->
        <button class="drop-btn" id="btnDrop">DROP CLAW</button>
      </div>

      <!-- Bottom Prize Collection Dispenser -->
      <div class="dispenser-slot" id="dispenserTray">
        <span class="text-xs text-slate-500 font-semibold tracking-wider">PRIZE RETRIEVAL DOOR</span>
      </div>
    </section>
  </main>

  <!-- Winner Dare Reveal Modal -->
  <div class="modal-backdrop" id="prizeModal">
    <div class="modal-card text-center">
      <div class="w-14 h-14 mx-auto rounded-full bg-gradient-to-tr from-pink-500 to-amber-400 flex items-center justify-center text-2xl shadow-lg mb-2">
        🎁
      </div>
      <h2 class="text-xl font-black text-amber-300 uppercase tracking-wider mb-1">DARE UNLOCKED!</h2>
      <p class="text-xs text-slate-300 mb-3 font-semibold uppercase">Ball capsule opened! Perform this dare:</p>
      
      <div class="bg-black/60 border border-pink-500/50 rounded-xl p-4 mb-4 text-white font-bold text-base leading-snug break-words" id="prizeDareText">
        Dare description goes here
      </div>

      <button onclick="dismissPrizeModal()" class="w-full bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 text-white font-black py-3 rounded-xl shadow-lg shadow-pink-600/30 transition transform active:scale-95 text-sm uppercase tracking-wide">
        I ACCEPT THE DARE!
      </button>
    </div>
  </div>

  <!-- Interactive In-UI Dare Studio Modal -->
  <div class="modal-backdrop" id="studioModal">
    <div class="modal-card !max-w-[400px] text-left max-h-[90vh] flex flex-direction flex-col p-4">
      <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-700/60">
        <div>
          <h3 class="text-base font-black text-pink-400 uppercase tracking-wide">Dare Studio</h3>
          <p class="text-[11px] text-slate-400">Manage pool & chamber dares</p>
        </div>
        <button onclick="closeDareStudio()" class="text-slate-400 hover:text-white font-bold text-xl px-2">&times;</button>
      </div>

      <!-- Studio Mode Switcher Tabs -->
      <div class="flex gap-2 mb-3 bg-black/40 p-1 rounded-lg">
        <button id="tabListBtn" onclick="switchStudioTab('list')" class="flex-1 py-1.5 rounded-md font-bold text-xs bg-pink-600 text-white">
          Manage List (<span id="tabCountSpan">0</span>)
        </button>
        <button id="tabBulkBtn" onclick="switchStudioTab('bulk')" class="flex-1 py-1.5 rounded-md font-bold text-xs text-slate-400 hover:text-white">
          Bulk Paste / Edit
        </button>
      </div>

      <!-- TAB 1: Live List Management -->
      <div id="tabListContent" class="flex-1 flex flex-col min-h-0">
        <div class="flex gap-1.5 mb-2">
          <input type="text" id="quickDareInput" placeholder="Type a new dare here..." maxlength="180"
            class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-500"
            onkeydown="if(event.key === 'Enter') addSingleDare();">
          <button onclick="addSingleDare()" class="bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-lg text-xs font-black shrink-0">
            + Add
          </button>
        </div>

        <div id="dareItemsList" class="flex-1 overflow-y-auto custom-scroll pr-1 space-y-1.5 max-h-[220px]"></div>
      </div>

      <!-- TAB 2: Bulk Text Editor -->
      <div id="tabBulkContent" class="hidden flex-1 flex flex-col min-h-0">
        <p class="text-[11px] text-slate-400 mb-1">Paste or edit one dare per line:</p>
        <textarea id="bulkDaresTextarea" class="w-full flex-1 min-h-[190px] bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500 font-mono leading-relaxed resize-none custom-scroll"></textarea>
        <div class="flex justify-end mt-1.5">
          <button onclick="applyBulkTextDares()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg">
            Apply & Update Pool
          </button>
        </div>
      </div>

      <!-- Studio Footer: Import / Export / Stats -->
      <div class="mt-3 pt-2.5 border-t border-slate-700/60 flex flex-col gap-2">
        <div class="flex items-center justify-between text-[11px] text-slate-300">
          <span>Pool: <strong class="text-pink-400" id="studioTotalCount">0</strong> dares</span>
          <span>Chamber Balls: <strong class="text-amber-400" id="studioPitCount">0</strong></span>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <input type="file" id="fileUploadInput" accept=".txt,.json" onchange="handleFileImport(event)" class="hidden">
          <button onclick="document.getElementById('fileUploadInput').click()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold py-1.5 rounded-lg text-center flex items-center justify-center gap-1">
            <span>📥 Import File</span>
          </button>
          <button onclick="exportDaresToFile()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 font-bold py-1.5 rounded-lg text-center flex items-center justify-center gap-1">
            <span>💾 Export (.txt)</span>
          </button>
        </div>

        <div class="flex justify-between items-center pt-1">
          <button onclick="restoreDefaults()" class="text-[11px] text-slate-500 hover:text-slate-300 underline">
            Reset to Defaults
          </button>
          <button onclick="closeDareStudio()" class="bg-pink-600 hover:bg-pink-500 text-white font-black text-xs px-4 py-1.5 rounded-lg">
            Done Playing
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Audio Synthesis via Web Audio API ---
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!soundEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        // Safe failover for restricted iOS contexts
      }
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      btn.innerText = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    }

    function playTone(freq, type = 'sine', duration = 0.15, vol = 0.1) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playMotorHum() {
      playTone(135, 'triangle', 0.07, 0.035);
    }

    function playGraspSfx() {
      playTone(320, 'square', 0.12, 0.08);
      setTimeout(() => playTone(210, 'square', 0.16, 0.08), 70);
    }

    function playSlipSfx() {
      playTone(360, 'sawtooth', 0.1, 0.09);
      setTimeout(() => playTone(160, 'sawtooth', 0.28, 0.09), 85);
    }

    function playWinFanfare() {
      if (!soundEnabled) return;
      const notes = [440, 554, 659, 880];
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 'triangle', 0.25, 0.12), idx * 110);
      });
    }

    // --- Default Dare Pool & Storage Management ---
    const DEFAULT_DARE_POOL = [
      "Please check this link for your surprise: https://docs.google.com/document/d/1XUcXqydTXKLP7AppaE8qeUppnURBrJ5B2HQrjt7QA-8/edit?usp=drive_link",
      "Propose in the most dramatic Bollywood style possible 💍",
      "Flirt for two minutes in a foreign accent without laughing 😂",
      "Perform a playful 30-second dance to the most unromantic song 💃",
      "Give three ridiculously cheesy pickup lines 😘",
      "Hold eye contact for 30 seconds without laughing or looking away ❤️",
      "Whisper three secrets you've felt too shy to say aloud 🤫"
    ];

    const STORAGE_KEY_DARES = 'claw_arcade_dares_v1';
    let darePool = [];
    const BALL_COLORS = ['#ff2a6d', '#ffd166', '#05d9e8', '#06d6a0', '#a056f7', '#ff9f1c', '#ff5722', '#4cc9f0'];

    function loadDares() {
      const stored = localStorage.getItem(STORAGE_KEY_DARES);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length >= 1) {
            darePool = parsed;
            return;
          }
        } catch (e) {}
      }
      darePool = [...DEFAULT_DARE_POOL];
      saveDares();
    }

    function saveDares() {
      localStorage.setItem(STORAGE_KEY_DARES, JSON.stringify(darePool));
      updateDareStatsUI();
    }

    // --- Game Logic & Turn Sequences ---
    let remainingTurns = 10;
    let outcomesList = [];
    let isClawBusy = false;
    let clawX = 60;
    let moveInterval = null;
    let cooldownTimerInterval = null;
    let activePitBalls = [];

    function initGame() {
      loadDares();

      // Seed 2 or 3 wins randomized in 10 attempts
      const winsCount = Math.random() < 0.5 ? 2 : 3;
      const failsCount = 10 - winsCount;
      outcomesList = Array(failsCount).fill(false).concat(Array(winsCount).fill(true));
      outcomesList.sort(() => Math.random() - 0.5);

      reseedPitBalls();
      checkPersistentCooldown();
      updateTurnsDisplay();
      setClawX(clawX);
      bindTouchEvents();
    }

    function reseedPitBalls() {
      const pit = document.getElementById('pitContainer');
      pit.innerHTML = '';
      activePitBalls = [];

      const count = Math.min(darePool.length, Math.floor(Math.random() * 6) + 10);
      const shuffledDares = [...darePool].sort(() => Math.random() - 0.5);

      for (let i = 0; i < count; i++) {
        const dare = shuffledDares[i % shuffledDares.length];
        const color = BALL_COLORS[i % BALL_COLORS.length];
        activePitBalls.push({ dare, color, id: i + 1 });

        const ballEl = document.createElement('div');
        ballEl.className = 'capsule-ball';
        ballEl.style.backgroundColor = color;
        const rx = (Math.random() * 8 - 4).toFixed(1);
        const ry = (Math.random() * 6 - 3).toFixed(1);
        ballEl.style.transform = `translate(${rx}px, ${ry}px)`;
        ballEl.innerText = `${i + 1}`;
        pit.appendChild(ballEl);
      }

      updateDareStatsUI();
    }

    // --- Claw Movement & Touch Controls ---
    const MIN_CLAW_X = 22;
    const MAX_CLAW_X = 315;

    function setClawX(x) {
      clawX = Math.max(MIN_CLAW_X, Math.min(MAX_CLAW_X, x));
      const clawAssembly = document.getElementById('clawAssembly');
      clawAssembly.style.left = `${clawX}px`;
    }

    function startSteering(delta) {
      if (isClawBusy || remainingTurns <= 0) return;
      initAudio();
      setClawX(clawX + delta);
      playMotorHum();

      if (moveInterval) clearInterval(moveInterval);
      moveInterval = setInterval(() => {
        setClawX(clawX + delta);
        playMotorHum();
      }, 45);
    }

    function stopSteering() {
      if (moveInterval) {
        clearInterval(moveInterval);
        moveInterval = null;
      }
    }

    function attachPadListener(btnId, delta) {
      const el = document.getElementById(btnId);
      const onStart = (e) => {
        if (e.cancelable) e.preventDefault();
        startSteering(delta);
      };
      const onEnd = (e) => {
        if (e.cancelable) e.preventDefault();
        stopSteering();
      };

      el.addEventListener('touchstart', onStart, { passive: false });
      el.addEventListener('touchend', onEnd, { passive: false });
      el.addEventListener('mousedown', onStart);
      window.addEventListener('mouseup', onEnd);
    }

    function bindTouchEvents() {
      attachPadListener('btnLeft', -7);
      attachPadListener('btnRight', 7);

      const dropBtn = document.getElementById('btnDrop');
      const handleDropTrigger = (e) => {
        if (e && e.cancelable) e.preventDefault();
        initAudio();
        triggerClawDrop();
      };

      dropBtn.addEventListener('touchend', handleDropTrigger, { passive: false });
      dropBtn.addEventListener('click', handleDropTrigger);
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (isClawBusy) return;
      if (e.key === 'ArrowLeft' || e.key === 'a') setClawX(clawX - 8);
      if (e.key === 'ArrowRight' || e.key === 'd') setClawX(clawX + 8);
      if (e.key === ' ' || e.key === 'Enter') triggerClawDrop();
    });

    // --- Main Claw Drop & Physics Cycle ---
    async function triggerClawDrop() {
      if (isClawBusy || remainingTurns <= 0) return;
      isClawBusy = true;

      const btnDrop = document.getElementById('btnDrop');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const statusText = document.getElementById('statusText');
      const statusDot = document.getElementById('statusDot');
      const clawAssembly = document.getElementById('clawAssembly');
      const clawCable = document.getElementById('clawCable');
      const clawFingers = document.getElementById('clawFingers');
      const heldBall = document.getElementById('heldBall');

      btnDrop.disabled = true;
      btnLeft.disabled = true;
      btnRight.disabled = true;
      stopSteering();

      const attemptIndex = 10 - remainingTurns;
      const willWin = outcomesList[attemptIndex] ?? false;
      remainingTurns--;
      updateTurnsDisplay();

      // 1. Descend to the pit
      statusText.innerText = 'Descending...';
      statusText.className = 'text-amber-300 text-xs font-bold uppercase tracking-wider';
      statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-amber-300 animate-pulse';

      const transRule = 'all 0.85s cubic-bezier(0.3, 0, 0.2, 1)';
      clawAssembly.style.webkitTransition = transRule;
      clawAssembly.style.transition = transRule;
      clawCable.style.webkitTransition = transRule;
      clawCable.style.transition = transRule;

      clawAssembly.style.top = '175px';
      clawCable.style.height = '165px';
      playTone(180, 'triangle', 0.8, 0.05);
      await delay(850);

      // 2. Grasp attempt
      statusText.innerText = 'Grasping...';
      clawFingers.classList.add('closed');
      playGraspSfx();
      await delay(350);

      const pickedBall = activePitBalls[Math.floor(Math.random() * activePitBalls.length)];
      heldBall.style.backgroundColor = pickedBall.color;
      heldBall.innerText = pickedBall.id;
      heldBall.style.display = 'flex';

      if (willWin) {
        // Firm grasp lift
        statusText.innerText = 'Firm Grip!';
        statusText.className = 'text-emerald-400 text-xs font-bold uppercase tracking-wider';
        statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';

        clawAssembly.style.top = '6px';
        clawCable.style.height = '28px';
        playTone(320, 'triangle', 0.8, 0.05);
        await delay(900);

        // Travel to drop chute
        statusText.innerText = 'Moving to Chute...';
        const chuteTrans = 'left 0.85s ease-in-out';
        clawAssembly.style.webkitTransition = chuteTrans;
        clawAssembly.style.transition = chuteTrans;
        clawAssembly.style.left = '42px';
        playTone(280, 'sine', 0.85, 0.05);
        await delay(900);
        setClawX(42);

        // Open fingers & dispense
        clawFingers.classList.remove('closed');
        heldBall.style.display = 'none';
        playWinFanfare();

        if (typeof confetti === 'function') {
          confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        }

        deliverPrizeCapsule(pickedBall);
        statusText.innerText = 'Dare Won!';
        await delay(500);

      } else {
        // Slippage mid-air
        statusText.innerText = 'Lifting...';
        clawAssembly.style.top = '100px';
        clawCable.style.height = '95px';
        playTone(220, 'triangle', 0.5, 0.05);
        await delay(550);

        clawFingers.classList.remove('closed');
        heldBall.style.display = 'none';
        playSlipSfx();

        statusText.innerText = 'Lost Grip!';
        statusText.className = 'text-rose-400 text-xs font-bold uppercase tracking-wider';
        statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping';
        await delay(400);

        clawAssembly.style.top = '6px';
        clawCable.style.height = '28px';
        await delay(600);
      }

      clawAssembly.style.webkitTransition = '';
      clawAssembly.style.transition = '';
      clawCable.style.webkitTransition = '';
      clawCable.style.transition = '';
      isClawBusy = false;

      if (remainingTurns <= 0) {
        startLockoutCooldown(60);
      } else {
        btnDrop.disabled = false;
        btnLeft.disabled = false;
        btnRight.disabled = false;
        statusText.innerText = 'Ready to Aim';
        statusText.className = 'text-emerald-400 text-xs font-bold uppercase tracking-wider';
        statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-400';
      }
    }

    // --- Prize Delivery & Modal ---
    function deliverPrizeCapsule(ballData) {
      const tray = document.getElementById('dispenserTray');
      tray.innerHTML = `
        <div class="dispensed-ball" onclick="openPrizeModal('${encodeURIComponent(ballData.dare)}')" style="background:${ballData.color}">
          <span>🎁</span>
          <span>BALL #${ballData.id}: TAP TO OPEN</span>
        </div>
      `;
    }

    function openPrizeModal(encodedDare) {
      initAudio();
      playTone(587.33, 'triangle', 0.3, 0.1);
      const dare = decodeURIComponent(encodedDare);
      
      const dareEl = document.getElementById('prizeDareText');
      if (dare.startsWith('http://') || dare.startsWith('https://') || dare.includes('http')) {
        const urlMatch = dare.match(/(https?:\/\/[^\s]+)/g);
        if (urlMatch) {
          const url = urlMatch[0];
          const textBefore = dare.replace(url, '');
          dareEl.innerHTML = `${escapeHtml(textBefore)} <br><a href="${url}" target="_blank" rel="noopener noreferrer" class="text-cyan-300 underline font-black block mt-2 p-2 bg-pink-950/70 rounded border border-cyan-400">Open Surprise Document 🔗</a>`;
        } else {
          dareEl.innerText = dare;
        }
      } else {
        dareEl.innerText = dare;
      }

      document.getElementById('prizeModal').classList.add('open');
      document.getElementById('dispenserTray').innerHTML = `
        <span class="text-xs text-slate-500 font-semibold tracking-wider">PRIZE RETRIEVED</span>
      `;
    }

    function dismissPrizeModal() {
      document.getElementById('prizeModal').classList.remove('open');
    }

    // --- 1-Minute Cooldown & Lockout ---
    const COOLDOWN_KEY = 'claw_machine_lockout_until';

    function startLockoutCooldown(seconds) {
      const unlockTime = Date.now() + seconds * 1000;
      localStorage.setItem(COOLDOWN_KEY, unlockTime.toString());
      runLockoutLoop(unlockTime);
    }

    function checkPersistentCooldown() {
      const stored = localStorage.getItem(COOLDOWN_KEY);
      if (stored) {
        const unlockTime = parseInt(stored, 10);
        if (Date.now() < unlockTime) {
          remainingTurns = 0;
          runLockoutLoop(unlockTime);
        } else {
          localStorage.removeItem(COOLDOWN_KEY);
        }
      }
    }

    function runLockoutLoop(unlockTime) {
      const btnDrop = document.getElementById('btnDrop');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const statusText = document.getElementById('statusText');
      const statusDot = document.getElementById('statusDot');

      btnDrop.disabled = true;
      btnLeft.disabled = true;
      btnRight.disabled = true;

      if (cooldownTimerInterval) clearInterval(cooldownTimerInterval);

      cooldownTimerInterval = setInterval(() => {
        const diffSeconds = Math.max(0, Math.ceil((unlockTime - Date.now()) / 1000));

        if (diffSeconds <= 0) {
          clearInterval(cooldownTimerInterval);
          localStorage.removeItem(COOLDOWN_KEY);

          remainingTurns = 10;
          const winsCount = Math.random() < 0.5 ? 2 : 3;
          outcomesList = Array(10 - winsCount).fill(false).concat(Array(winsCount).fill(true)).sort(() => Math.random() - 0.5);
          reseedPitBalls();

          btnDrop.disabled = false;
          btnLeft.disabled = false;
          btnRight.disabled = false;
          btnDrop.innerText = 'DROP CLAW';
          statusText.innerText = 'Machine Ready';
          statusText.className = 'text-emerald-400 text-xs font-bold uppercase tracking-wider';
          statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-400';
          updateTurnsDisplay();
        } else {
          btnDrop.innerText = `LOCKED (${diffSeconds}s)`;
          statusText.innerText = `Cooldown: ${diffSeconds}s`;
          statusText.className = 'text-rose-400 text-xs font-bold uppercase tracking-wider';
          statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse';
        }
      }, 500);
    }

    function updateTurnsDisplay() {
      document.getElementById('turnsCounter').innerText = `${remainingTurns}/10`;
    }

    function updateDareStatsUI() {
      document.getElementById('dareBadgeCount').innerText = darePool.length;
      document.getElementById('tabCountSpan').innerText = darePool.length;
      document.getElementById('studioTotalCount').innerText = darePool.length;
      document.getElementById('studioPitCount').innerText = activePitBalls.length;
    }

    // --- Interactive Dare Studio Management ---
    function openDareStudio() {
      renderDareListUI();
      document.getElementById('bulkDaresTextarea').value = darePool.join('\n');
      document.getElementById('studioModal').classList.add('open');
    }

    function closeDareStudio() {
      document.getElementById('studioModal').classList.remove('open');
    }

    function switchStudioTab(tab) {
      const listBtn = document.getElementById('tabListBtn');
      const bulkBtn = document.getElementById('tabBulkBtn');
      const listContent = document.getElementById('tabListContent');
      const bulkContent = document.getElementById('tabBulkContent');

      if (tab === 'list') {
        listBtn.className = 'flex-1 py-1.5 rounded-md font-bold text-xs bg-pink-600 text-white';
        bulkBtn.className = 'flex-1 py-1.5 rounded-md font-bold text-xs text-slate-400 hover:text-white';
        listContent.classList.remove('hidden');
        bulkContent.classList.add('hidden');
        renderDareListUI();
      } else {
        bulkBtn.className = 'flex-1 py-1.5 rounded-md font-bold text-xs bg-pink-600 text-white';
        listBtn.className = 'flex-1 py-1.5 rounded-md font-bold text-xs text-slate-400 hover:text-white';
        listContent.classList.add('hidden');
        bulkContent.classList.remove('hidden');
        document.getElementById('bulkDaresTextarea').value = darePool.join('\n');
      }
    }

    function renderDareListUI() {
      const container = document.getElementById('dareItemsList');
      container.innerHTML = '';

      darePool.forEach((dare, idx) => {
        const item = document.createElement('div');
        item.className = 'bg-slate-900/80 border border-slate-800 rounded-lg p-2 flex items-center justify-between gap-2 text-xs';
        item.innerHTML = `
          <div class="flex-1 truncate text-slate-200" id="dareText-${idx}">${escapeHtml(dare)}</div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="editDareInline(${idx})" title="Edit" class="text-slate-400 hover:text-amber-300 p-1">✏️</button>
            <button onclick="deleteDareByIndex(${idx})" title="Delete" class="text-slate-400 hover:text-rose-400 p-1">🗑️</button>
          </div>
        `;
        container.appendChild(item);
      });
      updateDareStatsUI();
    }

    function addSingleDare() {
      const input = document.getElementById('quickDareInput');
      const val = input.value.trim();
      if (!val) return;

      darePool.unshift(val);
      saveDares();
      input.value = '';
      renderDareListUI();
      reseedPitBalls();
    }

    function deleteDareByIndex(index) {
      if (darePool.length <= 1) {
        showTemporaryNotice('You need at least 1 dare in the pool!');
        return;
      }
      darePool.splice(index, 1);
      saveDares();
      renderDareListUI();
      reseedPitBalls();
    }

    function editDareInline(index) {
      const container = document.getElementById(`dareText-${index}`);
      const currentText = darePool[index];
      container.innerHTML = `
        <input type="text" id="inlineEditInput-${index}" value="${escapeHtml(currentText)}" 
          class="w-full bg-slate-950 border border-pink-500 rounded px-1.5 py-0.5 text-xs text-white"
          onkeydown="if(event.key === 'Enter') saveInlineEdit(${index}); else if(event.key === 'Escape') renderDareListUI();">
      `;
      const input = document.getElementById(`inlineEditInput-${index}`);
      input.focus();
      input.addEventListener('blur', () => saveInlineEdit(index));
    }

    function saveInlineEdit(index) {
      const input = document.getElementById(`inlineEditInput-${index}`);
      if (!input) return;
      const updated = input.value.trim();
      if (updated) {
        darePool[index] = updated;
        saveDares();
        reseedPitBalls();
      }
      renderDareListUI();
    }

    function applyBulkTextDares() {
      const raw = document.getElementById('bulkDaresTextarea').value;
      const parsed = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

      if (parsed.length < 1) {
        showTemporaryNotice('Please provide at least 1 dare line!');
        return;
      }

      darePool = parsed;
      saveDares();
      reseedPitBalls();
      switchStudioTab('list');
      showTemporaryNotice(`Updated pool with ${parsed.length} dares!`);
    }

    function restoreDefaults() {
      darePool = [...DEFAULT_DARE_POOL];
      saveDares();
      reseedPitBalls();
      renderDareListUI();
      showTemporaryNotice('Reset to default dares.');
    }

    // --- File Import & Export Utilities ---
    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        try {
          let list = [];
          if (file.name.endsWith('.json')) {
            const parsed = JSON.parse(text);
            if (Array.isArray(parsed)) {
              list = parsed.map(d => String(d).trim()).filter(Boolean);
            }
          } else {
            list = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          }

          if (list.length >= 1) {
            darePool = list;
            saveDares();
            reseedPitBalls();
            renderDareListUI();
            showTemporaryNotice(`Loaded ${list.length} dares from ${file.name}`);
          } else {
            showTemporaryNotice('File must have at least 1 dare line.');
          }
        } catch (err) {
          showTemporaryNotice('Failed to parse file. Make sure it is valid text/json.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function exportDaresToFile() {
      const blob = new Blob([darePool.join('\n')], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dares_arcade_export_${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function showTemporaryNotice(msg) {
      const statusText = document.getElementById('statusText');
      const original = statusText.innerText;
      statusText.innerText = msg;
      setTimeout(() => {
        statusText.innerText = original;
      }, 2200);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m];
      });
    }

    function delay(ms) {
      return new Promise(res => setTimeout(res, ms));
    }

    // Launch game on load
    window.onload = initGame;
  </script>
</body>
</html>
